<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloorStock — Inventory &amp; Expiration Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDEFF1;
    --ink: #1C2530;
    --muted: #8A97A3;
    --muted-2: #4A5560;
    --border: #C7CDD3;
    --border-light: #E2E6E9;
    --card-border: #EEF0F2;
    --accent: #2D5F8A;
    --amber: #F5A623;
    --surface: #F3F5F6;
    --expired-band: #C1443C; --expired-tint: #FBEAE8; --expired-text: #8C2E27;
    --critical-band: #D9822B; --critical-tint: #FDF0E1; --critical-text: #95580F;
    --soon-band: #C9A227; --soon-tint: #FBF6DF; --soon-text: #7A6118;
    --ok-band: #3F8F5F; --ok-tint: #E9F5EE; --ok-text: #276B41;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  header {
    background: var(--ink);
    color: var(--bg);
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 34px; height: 34px; background: var(--accent); border-radius: 6px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-title { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; line-height: 1; }
  .brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }
  .btn-primary {
    display: flex; align-items: center; gap: 6px;
    background: var(--amber); color: var(--ink); border: none; border-radius: 6px;
    padding: 10px 16px; font-weight: 600; font-size: 14px;
  }

  .alert-strip { background: var(--soon-tint); border-bottom: 1px solid #E8C88C; }
  .alert-toggle {
    width: 100%; max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; background: none; border: none; text-align: left; color: #7A5310; font-size: 14px;
  }
  .alert-toggle .count { font-weight: 600; }
  .alert-toggle .breakdown { color: var(--critical-text); font-size: 13px; }
  .alert-toggle .chev { margin-left: auto; transition: transform 0.15s; }
  .alert-toggle.open .chev { transform: rotate(180deg); }
  .alert-list { max-width: 1100px; margin: 0 auto; padding: 0 20px 14px; display: none; flex-direction: column; gap: 6px; }
  .alert-list.open { display: flex; }
  .alert-row {
    display: flex; justify-content: space-between; background: #fff; border-radius: 6px;
    padding: 8px 12px; font-size: 13px;
  }
  .alert-row .name { font-weight: 600; }
  .alert-row .meta { color: var(--muted); display: flex; gap: 12px; }

  main { max-width: 1100px; margin: 0 auto; padding: 20px 20px 80px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search-wrap { position: relative; flex: 1 1 220px; min-width: 180px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); }
  .search-wrap input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 7px; border: 1px solid var(--border); background: #fff; font-size: 14px; }
  select.tool-select { padding: 10px; border-radius: 7px; border: 1px solid var(--border); background: #fff; font-size: 13.5px; }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty-state .title { font-size: 16px; font-weight: 600; color: var(--muted-2); margin-bottom: 4px; }
  .empty-state .sub { font-size: 13.5px; margin-bottom: 16px; }
  .empty-state button { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 10px 18px; font-weight: 600; font-size: 14px; }
  .no-match { text-align: center; padding: 60px 20px; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 20px; }

  .tag-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(28,37,48,0.1); border: 1px solid var(--border-light); }
  .tag-band { height: 5px; }
  .tag-body { padding: 14px 16px; }
  .tag-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .tag-name { font-weight: 700; font-size: 15.5px; line-height: 1.25; }
  .tag-status { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.4px; text-transform: uppercase; }
  .tag-upc { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tag-loc { display: flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 13px; color: var(--muted-2); }
  .tag-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; }
  .tag-date { font-size: 12px; color: var(--muted); }
  .tag-days { font-size: 13px; font-weight: 600; }
  .tag-qty { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; }
  .tag-qty .unit { font-size: 11px; color: var(--muted); font-weight: 500; }
  .tag-actions { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid var(--card-border); padding-top: 10px; }
  .tag-actions button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--surface); border: none; border-radius: 6px; padding: 7px 0; font-size: 12.5px; font-weight: 600; color: var(--muted-2); }
  .tag-actions .del-btn { flex: 0 0 auto; padding: 7px 10px; color: var(--expired-band); }
  .tag-actions .del-btn.confirm { background: var(--expired-band); color: #fff; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(28,37,48,0.55); display: none; align-items: center; justify-content: center; z-index: 250; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 10px; width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--card-border); }
  .modal-title { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0.3px; }
  .modal-close { background: none; border: none; color: var(--muted); padding: 4px; }
  form { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  label.field-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted-2); margin-bottom: 5px; }
  .field-input { width: 100%; padding: 10px 12px; border-radius: 7px; border: 1px solid var(--border); font-size: 14px; background: #fff; }
  .field-input.mono { font-family: 'IBM Plex Mono', monospace; }
  .row-2 { display: flex; gap: 10px; }
  .row-2 > div { flex: 1; }
  .upc-row { display: flex; gap: 8px; }
  .upc-row .field-input { flex: 1; }
  .scan-btn { display: flex; align-items: center; gap: 5px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--accent); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .scan-btn.active { background: var(--expired-tint); color: var(--expired-band); }
  #scanVideo { width: 100%; border-radius: 7px; margin-top: 8px; background: #000; display: none; }
  #scanVideo.on { display: block; }
  .scan-error { font-size: 12px; color: var(--critical-text); margin-top: 6px; }
  .form-error { font-size: 13px; color: var(--expired-band); font-weight: 500; }
  .submit-btn { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 12px 0; font-weight: 700; font-size: 14.5px; margin-top: 4px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 7px; font-size: 13.5px; font-weight: 500; box-shadow: 0 4px 14px rgba(0,0,0,0.25); z-index: 300; display: none; align-items: center; gap: 6px; }
  .toast.show { display: flex; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      </div>
      <div>
        <div class="brand-title">FLOORSTOCK</div>
        <div class="brand-sub">INVENTORY &amp; EXPIRATION TRACKING</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
    <div id="connStatus" style="display:none;align-items:center;gap:6px;font-size:12.5px;color:#F5A623;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      Can&rsquo;t reach server
    </div>
    <button class="btn-primary" id="newTagBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      New tag
    </button>
    </div>
  </div>
</header>

<div class="alert-strip" id="alertStrip" style="display:none;">
  <button class="alert-toggle" id="alertToggle">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <span class="count" id="alertCount"></span>
    <span class="breakdown" id="alertBreakdown"></span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="alert-list" id="alertList"></div>
</div>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A97A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" placeholder="Search name, UPC, or location">
    </div>
    <select class="tool-select" id="locationFilter"><option value="all">All locations</option></select>
    <select class="tool-select" id="urgencyFilter">
      <option value="all">All statuses</option>
      <option value="expired">Expired</option>
      <option value="critical">Critical (≤3d)</option>
      <option value="soon">Soon (≤14d)</option>
      <option value="ok">Fresh</option>
    </select>
    <select class="tool-select" id="sortBy">
      <option value="expiration">Sort: expiration</option>
      <option value="name">Sort: name</option>
      <option value="location">Sort: location</option>
    </select>
  </div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#8A97A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:10px;"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
    <div class="title">No stock tagged yet</div>
    <div class="sub">Scan or add the first product coming onto the floor.</div>
    <button id="emptyAddBtn">Add first tag</button>
  </div>

  <div class="no-match" id="noMatch" style="display:none;">No tags match those filters.</div>

  <div class="grid" id="grid"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">NEW TAG</div>
      <button class="modal-close" id="modalCloseBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <form id="itemForm">
      <input type="hidden" id="editId">
      <div>
        <label class="field-label">UPC / barcode</label>
        <div class="upc-row">
          <input class="field-input mono" id="upcInput" placeholder="e.g. 041220576428">
          <button type="button" class="scan-btn" id="scanBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
            <span id="scanBtnLabel">Scan</span>
          </button>
        </div>
        <video id="scanVideo" muted playsinline></video>
        <div class="scan-error" id="scanError" style="display:none;"></div>
      </div>
      <div>
        <label class="field-label">Product name</label>
        <input class="field-input" id="nameInput" placeholder="e.g. Organic Whole Milk 1gal">
      </div>
      <div>
        <label class="field-label">Expiration date</label>
        <input class="field-input" type="date" id="expInput">
      </div>
      <div class="row-2">
        <div>
          <label class="field-label">Quantity</label>
          <input class="field-input mono" type="number" min="0" step="any" id="qtyInput" placeholder="0">
        </div>
        <div>
          <label class="field-label">Unit</label>
          <select class="field-input" id="unitInput">
            <option>each</option><option>case</option><option>box</option><option>pallet</option>
            <option>lb</option><option>kg</option><option>oz</option><option>gal</option><option>L</option>
          </select>
        </div>
      </div>
      <div>
        <label class="field-label">Location on floor</label>
        <input class="field-input" id="locInput" placeholder="e.g. Aisle 4, Shelf B">
      </div>
      <div class="form-error" id="formError" style="display:none;"></div>
      <button type="submit" class="submit-btn" id="submitBtn">Add to floor</button>
    </form>
  </div>
</div>

<div class="toast" id="toast">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastMsg"></span>
</div>

<script>
(function () {
  'use strict';

  const API_BASE = '/api/items';
  const POLL_INTERVAL_MS = 10000;
  let items = [];
  let editingId = null;
  let scanStream = null;
  let scanRAF = null;
  let detector = null;
  let isSubmitting = false;

  // ---------- API ----------
  async function apiRequest(path, options) {
    let res;
    try {
      res = await fetch(path, options);
    } catch (e) {
      throw new Error('Can\u2019t reach the server — check your connection.');
    }
    if (!res.ok) {
      let msg = 'Something went wrong.';
      try { const body = await res.json(); if (body.error) msg = body.error; } catch (e) {}
      throw new Error(msg);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async function loadItems() {
    try {
      items = await apiRequest(API_BASE);
      setConnectionStatus(true);
    } catch (e) {
      setConnectionStatus(false);
    }
  }

  function setConnectionStatus(online) {
    const el = document.getElementById('connStatus');
    if (!el) return;
    if (online) {
      el.style.display = 'none';
    } else {
      el.style.display = 'flex';
    }
  }

  // ---------- helpers ----------
  function daysUntil(dateStr) {
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }
  function urgency(dateStr) {
    const d = daysUntil(dateStr);
    if (d < 0) return 'expired';
    if (d <= 3) return 'critical';
    if (d <= 14) return 'soon';
    return 'ok';
  }
  const URGENCY_META = {
    expired: { label: 'Expired', band: 'var(--expired-band)', tint: 'var(--expired-tint)', text: 'var(--expired-text)' },
    critical:{ label: 'Critical', band: 'var(--critical-band)', tint: 'var(--critical-tint)', text: 'var(--critical-text)' },
    soon:    { label: 'Soon', band: 'var(--soon-band)', tint: 'var(--soon-tint)', text: 'var(--soon-text)' },
    ok:      { label: 'Fresh', band: 'var(--ok-band)', tint: 'var(--ok-tint)', text: 'var(--ok-text)' },
  };
  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function daysLabel(dateStr) {
    const d = daysUntil(dateStr);
    if (d < 0) return Math.abs(d) + 'd overdue';
    if (d === 0) return 'Today';
    if (d === 1) return '1 day left';
    return d + ' days left';
  }
  function esc(str) {
    const d = document.createElement('div'); d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  // ---------- rendering ----------
  function getLocations() {
    return Array.from(new Set(items.map(i => i.location).filter(Boolean))).sort();
  }

  function renderLocationOptions() {
    const sel = document.getElementById('locationFilter');
    const current = sel.value;
    sel.innerHTML = '<option value="all">All locations</option>' +
      getLocations().map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
    sel.value = getLocations().includes(current) ? current : 'all';
  }

  function renderAlerts() {
    const alertItems = items.filter(i => ['expired','critical','soon'].includes(urgency(i.expirationDate)));
    const strip = document.getElementById('alertStrip');
    if (alertItems.length === 0) { strip.style.display = 'none'; return; }
    strip.style.display = 'block';

    const expired = alertItems.filter(i => urgency(i.expirationDate) === 'expired').length;
    const critical = alertItems.filter(i => urgency(i.expirationDate) === 'critical').length;
    const soon = alertItems.filter(i => urgency(i.expirationDate) === 'soon').length;

    document.getElementById('alertCount').textContent = `${alertItems.length} tag${alertItems.length !== 1 ? 's' : ''} need attention`;
    const parts = [];
    if (expired) parts.push(`${expired} expired`);
    if (critical) parts.push(`${critical} critical`);
    if (soon) parts.push(`${soon} expiring soon`);
    document.getElementById('alertBreakdown').textContent = parts.join(' \u00b7 ');

    const sorted = alertItems.slice().sort((a,b) => daysUntil(a.expirationDate) - daysUntil(b.expirationDate));
    document.getElementById('alertList').innerHTML = sorted.map(it => {
      const meta = URGENCY_META[urgency(it.expirationDate)];
      return `<div class="alert-row" style="border-left:3px solid ${meta.band}">
        <span class="name">${esc(it.name)}</span>
        <span class="meta">
          <span>${locationPin()} ${esc(it.location)}</span>
          <span style="color:${meta.text};font-weight:600;">${daysLabel(it.expirationDate)}</span>
        </span>
      </div>`;
    }).join('');
  }
  function locationPin() {
    return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`;
  }

  function getFiltered() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const locationFilter = document.getElementById('locationFilter').value;
    const urgencyFilter = document.getElementById('urgencyFilter').value;
    const sortBy = document.getElementById('sortBy').value;

    let list = items.filter(it => {
      const matchesSearch = !search ||
        it.name.toLowerCase().includes(search) ||
        it.upc.includes(search) ||
        it.location.toLowerCase().includes(search);
      const matchesLocation = locationFilter === 'all' || it.location === locationFilter;
      const matchesUrgency = urgencyFilter === 'all' || urgency(it.expirationDate) === urgencyFilter;
      return matchesSearch && matchesLocation && matchesUrgency;
    });

    list.sort((a, b) => {
      if (sortBy === 'expiration') return daysUntil(a.expirationDate) - daysUntil(b.expirationDate);
      if (sortBy === 'name') return a.name.localeCompare(b.name);
      if (sortBy === 'location') return a.location.localeCompare(b.location);
      return 0;
    });
    return list;
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const empty = document.getElementById('emptyState');
    const noMatch = document.getElementById('noMatch');

    if (items.length === 0) {
      empty.style.display = 'block';
      noMatch.style.display = 'none';
      grid.innerHTML = '';
      return;
    }
    empty.style.display = 'none';

    const filtered = getFiltered();
    if (filtered.length === 0) {
      noMatch.style.display = 'block';
      grid.innerHTML = '';
      return;
    }
    noMatch.style.display = 'none';

    grid.innerHTML = filtered.map(it => {
      const meta = URGENCY_META[urgency(it.expirationDate)];
      return `
      <div class="tag-card">
        <div class="tag-band" style="background:${meta.band}"></div>
        <div class="tag-body">
          <div class="tag-top">
            <div class="tag-name">${esc(it.name)}</div>
            <span class="tag-status" style="background:${meta.tint};color:${meta.text};">${meta.label}</span>
          </div>
          <div class="tag-upc">${esc(it.upc)}</div>
          <div class="tag-loc">${locationPin()} ${esc(it.location)}</div>
          <div class="tag-bottom">
            <div>
              <div class="tag-date">${formatDate(it.expirationDate)}</div>
              <div class="tag-days" style="color:${meta.text}">${daysLabel(it.expirationDate)}</div>
            </div>
            <div class="tag-qty">${esc(it.quantity)} <span class="unit">${esc(it.unit)}</span></div>
          </div>
          <div class="tag-actions">
            <button type="button" class="edit-btn" data-id="${it.id}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
              Edit
            </button>
            <button type="button" class="del-btn" data-id="${it.id}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
      </div>`;
    }).join('');

    grid.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => openModal(btn.dataset.id));
    });
    grid.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => handleDeleteClick(btn));
    });
  }

  async function handleDeleteClick(btn) {
    if (!btn.classList.contains('confirm')) {
      btn.classList.add('confirm');
      btn.textContent = 'Confirm';
      const blur = () => { btn.classList.remove('confirm'); btn.textContent = ''; btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'; };
      const onBlur = () => { blur(); btn.removeEventListener('blur', onBlur); };
      btn.addEventListener('blur', onBlur);
      btn.focus();
      return;
    }
    const id = btn.dataset.id;
    try {
      await apiRequest(`${API_BASE}/${id}`, { method: 'DELETE' });
      items = items.filter(i => i.id !== id);
      renderAll();
      showToast('Tag removed');
    } catch (e) {
      showToast(e.message || 'Couldn\u2019t remove the tag');
    }
  }

  function renderAll() {
    renderLocationOptions();
    renderAlerts();
    renderGrid();
  }

  // ---------- modal / form ----------
  function openModal(id) {
    editingId = id || null;
    const item = editingId ? items.find(i => i.id === editingId) : null;

    document.getElementById('modalTitle').textContent = item ? 'EDIT TAG' : 'NEW TAG';
    document.getElementById('submitBtn').textContent = item ? 'Save changes' : 'Add to floor';
    document.getElementById('editId').value = editingId || '';
    document.getElementById('upcInput').value = item ? item.upc : '';
    document.getElementById('nameInput').value = item ? item.name : '';
    document.getElementById('expInput').value = item ? item.expirationDate : '';
    document.getElementById('qtyInput').value = item ? item.quantity : '';
    document.getElementById('unitInput').value = item ? item.unit : 'each';
    document.getElementById('locInput').value = item ? item.location : '';
    document.getElementById('formError').style.display = 'none';
    document.getElementById('scanError').style.display = 'none';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    stopScan();
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
  }

  async function submitForm(e) {
    e.preventDefault();
    if (isSubmitting) return;

    const upc = document.getElementById('upcInput').value.trim();
    const name = document.getElementById('nameInput').value.trim();
    const expirationDate = document.getElementById('expInput').value;
    const quantityRaw = document.getElementById('qtyInput').value;
    const unit = document.getElementById('unitInput').value;
    const location = document.getElementById('locInput').value.trim();
    const errEl = document.getElementById('formError');

    let err = '';
    if (!upc) err = 'UPC is required.';
    else if (!name) err = 'Product name is required.';
    else if (!expirationDate) err = 'Expiration date is required.';
    else if (quantityRaw === '' || Number(quantityRaw) < 0) err = 'Enter a valid quantity.';
    else if (!location) err = 'Location is required.';

    if (err) {
      errEl.textContent = err;
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    const data = { upc, name, expirationDate, quantity: Number(quantityRaw), unit, location };
    const submitBtn = document.getElementById('submitBtn');
    const originalLabel = submitBtn.textContent;
    isSubmitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving\u2026';

    try {
      if (editingId) {
        const updated = await apiRequest(`${API_BASE}/${editingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        items = items.map(i => i.id === editingId ? updated : i);
        showToast('Tag updated');
      } else {
        const created = await apiRequest(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        items.push(created);
        showToast('Tag added to floor');
      }
      renderAll();
      closeModal();
    } catch (e) {
      errEl.textContent = e.message || 'Couldn\u2019t save the tag.';
      errEl.style.display = 'block';
    } finally {
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }
  }

  // ---------- barcode scanning ----------
  function stopScan() {
    if (scanRAF) cancelAnimationFrame(scanRAF);
    scanRAF = null;
    if (scanStream) {
      scanStream.getTracks().forEach(t => t.stop());
      scanStream = null;
    }
    const video = document.getElementById('scanVideo');
    video.classList.remove('on');
    video.srcObject = null;
    document.getElementById('scanBtn').classList.remove('active');
    document.getElementById('scanBtnLabel').textContent = 'Scan';
  }

  async function startScan() {
    const errEl = document.getElementById('scanError');
    errEl.style.display = 'none';

    if (!('BarcodeDetector' in window)) {
      errEl.textContent = 'Live scanning isn\u2019t supported in this browser \u2014 enter the UPC manually below.';
      errEl.style.display = 'block';
      return;
    }
    try {
      detector = new window.BarcodeDetector({ formats: ['upc_a','upc_e','ean_13','ean_8','code_128'] });
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      scanStream = stream;
      const video = document.getElementById('scanVideo');
      video.srcObject = stream;
      video.classList.add('on');
      await video.play();
      document.getElementById('scanBtn').classList.add('active');
      document.getElementById('scanBtnLabel').textContent = 'Stop';

      const tick = async () => {
        if (!scanStream) return;
        try {
          const codes = await detector.detect(video);
          if (codes.length > 0) {
            document.getElementById('upcInput').value = codes[0].rawValue;
            stopScan();
            return;
          }
        } catch (e) { /* keep trying */ }
        scanRAF = requestAnimationFrame(tick);
      };
      scanRAF = requestAnimationFrame(tick);
    } catch (e) {
      errEl.textContent = 'Camera access was blocked or unavailable \u2014 enter the UPC manually below.';
      errEl.style.display = 'block';
      stopScan();
    }
  }

  // ---------- wire up ----------
  document.getElementById('newTagBtn').addEventListener('click', () => openModal(null));
  document.getElementById('emptyAddBtn').addEventListener('click', () => openModal(null));
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });
  document.getElementById('itemForm').addEventListener('submit', submitForm);
  document.getElementById('scanBtn').addEventListener('click', () => { scanStream ? stopScan() : startScan(); });

  document.getElementById('alertToggle').addEventListener('click', function () {
    this.classList.toggle('open');
    document.getElementById('alertList').classList.toggle('open');
  });

  ['searchInput'].forEach(id => document.getElementById(id).addEventListener('input', renderGrid));
  ['locationFilter','urgencyFilter','sortBy'].forEach(id => document.getElementById(id).addEventListener('change', renderGrid));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('open')) closeModal();
  });

  // ---------- polling (picks up changes from other devices) ----------
  async function poll() {
    if (document.getElementById('modalOverlay').classList.contains('open')) return;
    if (document.hidden) return;
    await loadItems();
    renderAll();
  }

  // ---------- init ----------
  (async function init() {
    await loadItems();
    renderAll();
    setInterval(poll, POLL_INTERVAL_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  })();
})();
</script>
</body>
</html>
